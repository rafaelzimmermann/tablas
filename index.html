<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#F4F8FC" />
    <meta
      name="description"
      content="A little maths practice, a little more confidence. Play multiplication, addition, subtraction and division in English or Spanish."
    />
    <title>Tablas · Play</title>
    <link rel="stylesheet" href="style.css" />
    <link rel="icon" href="/favicon.ico" sizes="48x48" />
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
  </head>
  <body>
    <a class="skip-link" href="#main">Skip to game</a>
    <div id="app">
      <header id="header"></header>
      <div
        id="storage-status"
        class="storage-status"
        role="status"
        hidden
      ></div>
      <main id="main" tabindex="-1"></main>
      <footer id="footer"></footer>
      <dialog
        id="pause-dialog"
        aria-labelledby="pause-title"
        aria-describedby="pause-description"
      ></dialog>
      <p id="announcer" class="sr-only" role="status" aria-live="polite"></p>
    </div>
    <script type="module" src="src/main.js"></script>
  </body>
</html>
