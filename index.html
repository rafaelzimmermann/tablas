<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#F4F8FC" />
    <meta
      name="description"
      content="A little maths practice, a little more confidence. Play multiplication, addition, subtraction and division in English or Spanish."
    />
    <title>Tablas · Play</title>
    <link rel="stylesheet" href="style.css" />
    <link
      rel="icon"
      href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='16' fill='%23245BCC'/%3E%3Ctext x='32' y='46' text-anchor='middle' font-family='sans-serif' font-size='48' font-weight='bold' fill='white'%3E×%3C/text%3E%3C/svg%3E"
    />
  </head>
  <body>
    <a class="skip-link" href="#main">Skip to game</a>
    <div id="app">
      <header id="header"></header>
      <div
        id="storage-status"
        class="storage-status"
        role="status"
        hidden
      ></div>
      <main id="main" tabindex="-1"></main>
      <footer id="footer"></footer>
      <dialog
        id="pause-dialog"
        aria-labelledby="pause-title"
        aria-describedby="pause-description"
      ></dialog>
      <p id="announcer" class="sr-only" role="status" aria-live="polite"></p>
    </div>
    <script type="module" src="src/main.js"></script>
  </body>
</html>
