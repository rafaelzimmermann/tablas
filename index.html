<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Math Speed Games</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div id="app">
        <section id="start-screen" class="screen visible">
            <div class="language-selector">
                <button class="lang-btn active" data-lang="en">🇺🇸</button>
                <button class="lang-btn" data-lang="es">🇪🇸</button>
            </div >
            <h1 data-i18n="title">Math Speed Games</h1>
            <p class="instruction" data-i18n="start-instruction">Enter your name to start!</p>
            <div class="input-group">
                <input type="text" id="username-input" data-i18n-placeholder="name-placeholder" placeholder="Enter your name" maxlength="15">
            </div >
            <button id="continue-btn" class="primary-btn" data-i18n="start-game">Continue</button>
            <div class="divider"></div>
            <button id="view-leaderboard-btn" class="secondary-btn" data-i18n="leaderboard">View Leaderboard</button>
        </section>

        <section id="game-selection-screen" class="screen">
            <h1 data-i18n="select-game">Select a Game</h1>
            <div class="game-selection-grid">
                <button class="game-btn" data-game="multiplication">
                    <span class="icon">✖️</span>
                    <span data-i18n="multiplication">Multiplication</span>
                </button>
                <button class="game-btn" data-game="sum">
                    <span class="icon">➕</span>
                    <span data-i18n="sum">Sum</span>
                </button>
                <button class="game-btn" data-game="subtraction">
                    <span class="icon">➖</span>
                    <span data-i18n="subtraction">Subtraction</span>
                </button>
                <button class="game-btn" data-game="division">
                    <span class="icon">➗</span>
                    <span data-i18n="division">Division</span>
                </button>
            </div>
            <button class="secondary-btn" id="back-to-start-btn" data-i18n="back">Back</button>
        </section>

        <section id="mode-level-screen" class="screen">
            <h1 data-i18n="select-mode">Select Mode & Level</h1>
            
            <div class="mode-selection">
                <p data-i18n="difficulty-label">Select Mode:</p>
                <div class="mode-buttons">
                    <button class="mode-btn" data-mode="bullet" data-i18n-mode="bullet">Bullet (30s)</button>
                    <button class="mode-btn" data-mode="blitz" data-i18n-mode="blitz">Blitz (60s)</button>
                    <button class="mode-btn" data-mode="rapid" data-i18n-mode="rapid">Rapid (120s)</button>
                </div>
            </div>

            <div class="level-selection">
                <p data-i18n="difficulty-label">Select Level:</p>
                <div class="level-buttons">
                    <button class="level-btn" data-level="1" data-i18n-level="level1">Level 1 (1-9)</button>
                    <button class="level-btn" data-level="2" data-i18n-level="level2">Level 2 (1-99)</button>
                    <button class="level-btn" data-level="3" data-i18n-level="level3">Level 3 (1-999)</button>
                </div>
            </div>

            <button id="start-game-btn" class="primary-btn" data-i18n="start-game">Start</button>
            <button class="secondary-btn" id="back-to-games-btn" data-i18n="back-to-games">Back to Games</button>
        </section>

        <section id="countdown-screen" class="screen">
            <div id="countdown-display">3</div>
        </section>

        <section id="game-screen" class="screen">
            <div class="game-header">
                <div id="timer-display" data-i18n-prefix="time-prefix">Time: 30s</div>
                <div id="score-display" data-i18n-prefix="score-prefix">Score: 0</div>
            </div>
            <div id="question-display">5 × 5</div>
            <input type="number" id="answer-input" pattern="\d*" inputmode="numeric">
            <div id="number-keyboard" class="keyboard">
                <button class="key" data-key="1">1</button>
                <button class="key" data-key="2">2</button>
                <button class="key" data-key="3">3</button>
                <button class="key" data-key="4">4</button>
                <button class="key" data-key="5">5</button>
                <button class="key" data-key="6">6</button>
                <button class="key" data-key="7">7</button>
                <button class="key" data-key="8">8</button>
                <button class="key" data-key="9">9</button>
                <button class="key special" data-key="Backspace">⌫</button>
                <button class="key" data-key="0">0</button>
                <button class="key special" data-key="Clear">C</button>
            </div>
        </section>

        <section id="results-screen" class="screen">
            <h2 data-i18n="game-over">Game Over!</h2>
            <div class="result-stats">
                <p><span data-i18n="score-label">Score</span>: <span id="final-score">0</span></p>
                <p id="new-record-msg" class="hidden" data-i18n="new-record">🎉 New Personal Record!</p>
            </div>
            <button id="restart-btn" data-i18n="restart">Play Again</button>
            <button id="leaderboard-btn" data-i18n="leaderboard">View Leaderboard</button>
        </section>

        <section id="leaderboard-screen" class="screen">
            <h2 data-i18n="leaderboard-title">Leaderboard</h2>
            <div class="leaderboard-filters">
                <button class="filter-btn active" data-mode="bullet" data-i18n-mode="bullet">Bullet</button>
                <button class="filter-btn" data-mode="blitz" data-i18n-mode="blitz">Blitz</button>
                <button class="filter-btn" data-mode="rapid" data-i18n-mode="rapid">Rapid</button>
            </div>
            <div id="leaderboard-list"></div>
            <button id="back-to-start-btn" data-i18n="back">Back to Start</button>
        </section>
    </div>
    <script type="module" src="src/main.js"></script>
</body>
</html>
